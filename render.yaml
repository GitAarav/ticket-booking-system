services:
  - type: web
    name: ticket-booking-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SEAT_HOLD_TTL_MINUTES
        value: "10"
      - key: WAITLIST_OFFER_TTL_MINUTES
        value: "15"
      - key: SWEEP_INTERVAL_SECONDS
        value: "10"
      - key: CLIENT_URL
        sync: false
